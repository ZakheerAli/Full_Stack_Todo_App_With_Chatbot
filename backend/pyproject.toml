[tool.poetry]
name = "nexaflow-backend"
version = "0.1.0"
description = "FastAPI backend for NexaFlow Todo App"
authors = ["Admin <admin@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
sqlmodel = "^0.0.14"
alembic = "^1.13.1"
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"

aiosqlite = "^0.20.0"
python-multipart = "^0.0.9"
email-validator = "^2.1.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
# better-auth-python is not a real package yet, we will use standard JWT handling
# or verify if Better Auth has a python SDK. Research said verify.
# For now we will use PyJWT for manual verification if needed.
pyjwt = "^2.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.2.1"
httpx = "^0.26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
